name: CI & GitHub Pages

on:
  push:
    branches:
      - main
      - modular
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - modular
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "ci-pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  catalog:
    name: Catalog & GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate catalog & public assets
        run: |
          node tools/modules.js catalog

      - name: Commit & push updated catalog (if changed)
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update catalog.json and public assets [skip ci]"
          file_pattern: "catalog.json public/*"

      - name: Setup Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modular')
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modular')
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modular')
        id: deployment
        uses: actions/deploy-pages@v4

  build:
    name: Build PS2 Homebrew
    needs: catalog
    runs-on: ubuntu-latest
    # Pinned to immutable digest matching Dockerfile
    container: ghcr.io/ps2homebrew/ps2homebrew@sha256:207523ad98f17fd406afa7dd0c6cfe10730627545cbe45247f0bd73c8a66c376

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --prune --unshallow || true

      - name: Compile AthenaEnv Core (Release & Debug)
        run: |
          chmod +x build-exports.sh
          make clean all
          make debug
          # The native runtime must build without QuickJS, as an ELF and as a library.
          make all RUNTIME=native APP_SRCS=samples/native/hello/main.c
          make lib RUNTIME=native
          make sdk RUNTIME=native
          make all RUNTIME=native APP_SRCS=samples/native/move/main.c
          rm -f bin/athena_native*.elf
        env:
          ATHENAENV_SRC: "${{ github.workspace }}/src"

      - name: Prepare distribution bundle
        run: |
          mkdir -p dist
          cp -r bin dist/AthenaEnv
          cd dist
          tar -zcvf ../AthenaEnv.tar.gz AthenaEnv
          cd ..

      - name: Get short SHA
        id: slug
        run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AthenaEnv-${{ steps.slug.outputs.sha8 }}
          path: dist/AthenaEnv/
          retention-days: 14

      - name: Automatic Pre-release (main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AthenaEnv Development Build"
          body: "Automated development build from commit ${{ github.sha }}."
          prerelease: true
          files: AthenaEnv.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: AthenaEnv.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
