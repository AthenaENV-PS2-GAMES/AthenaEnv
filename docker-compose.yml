services:
  build:
    build: .
    volumes:
      - .:/src
    working_dir: /src
    environment:
      - ATHENAENV_SRC=/src/src
    command: make clean all

  debug:
    build: .
    volumes:
      - .:/src
    working_dir: /src
    environment:
      - ATHENAENV_SRC=/src/src
    command: make clean debug

  shell:
    build: .
    volumes:
      - .:/src
    working_dir: /src
    environment:
      - ATHENAENV_SRC=/src/src
    entrypoint: /bin/bash

  # Build server for the module picker. ATHENA_CHECKOUT must be a dedicated
  # clone (the server rewrites Makefile.modules and src/generated in it):
  #   git clone https://github.com/GibranKhalil/AthenaEnv ../athena-build
  #   ATHENA_CHECKOUT=../athena-build docker compose up build-server
  build-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    volumes:
      - ${ATHENA_CHECKOUT:-../athena-build}:/athena
      - build-cache:/cache
    environment:
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}
    ports:
      - "8080:8080"

volumes:
  build-cache:
